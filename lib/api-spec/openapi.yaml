openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: children
    description: Child profile operations
  - name: apps
    description: App catalog operations
  - name: childAppStatus
    description: Per-child app status operations
  - name: export
    description: Data export operations
  - name: dashboard
    description: Dashboard operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List children (archived profiles only with includeArchived=true)
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      summary: Create a child profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: "#/components/responses/BadRequest"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateChild
      tags: [children]
      summary: Update a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"


  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List apps
      parameters:
        - name: includeRemoved
          in: query
          required: false
          schema:
            type: boolean
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Category"
        - name: interestTag
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InterestTag"
      responses:
        "200":
          description: List of apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogApp"
    post:
      operationId: createApp
      tags: [apps]
      summary: Add an app to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApp"
        "400":
          $ref: "#/components/responses/BadRequest"

  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Get an app by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateApp
      tags: [apps]
      summary: Update an app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"


  /child-app-status/{childId}/{appId}:
    put:
      operationId: updateChildAppStatus
      tags: [childAppStatus]
      summary: Upsert per-child app status
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: appId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildAppStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildAppStatusRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /export:
    get:
      operationId: exportData
      tags: [export]
      summary: Export all data as JSON
      responses:
        "200":
          description: Full data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportData"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get per-child matched apps with statuses
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardEntry"

components:
  responses:
    BadRequest:
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string

    Id:
      type: integer
      multipleOf: 1
      minimum: 1

    InterestTag:
      type: string
      enum: [Engineering, Baking/Food, Music, Drawing, Reading, Math, Science, Gaming, Language Learning]

    Category:
      type: string
      enum: [Games, Education, Creative, Music, Reading]

    CostModel:
      type: string
      enum: [Free, One-time purchase, Subscription]

    AdStatus:
      type: string
      enum: [No Ads, Minimal, Has Ads]

    CatalogStatus:
      type: string
      description: Catalog soft delete. Removed apps keep their record and notes.
      enum: [Active, Removed]

    InstallStatus:
      type: string
      description: Per-child install state. Tracked by the parent; Apogee does not install anything.
      enum: [Not Installed, Pushed, Installed, Removed]

    ScreenTimeMinutes:
      type: integer
      multipleOf: 1
      minimum: 0
      maximum: 1440

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Child:
      type: object
      required: [id, name, age, interests, deviceName, screenTimeWeekday, screenTimeWeekend, appleArcade, archived, createdAt, updatedAt]
      properties:
        id:
          type: integer
          multipleOf: 1
        name:
          type: string
          minLength: 1
        age:
          type: integer
          multipleOf: 1
          minimum: 1
          maximum: 17
        interests:
          type: array
          items:
            $ref: "#/components/schemas/InterestTag"
        deviceName:
          type: string
          minLength: 1
        screenTimeWeekday:
          $ref: "#/components/schemas/ScreenTimeMinutes"
        screenTimeWeekend:
          $ref: "#/components/schemas/ScreenTimeMinutes"
        appleArcade:
          type: boolean
        archived:
          type: boolean
          description: Soft delete. Archived profiles keep their record and statuses but leave the dashboard and the default list.
        createdAt:
          type: string
        updatedAt:
          type: string

    ChildInput:
      type: object
      required: [name, age, interests, deviceName, screenTimeWeekday, screenTimeWeekend, appleArcade, archived]
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
          multipleOf: 1
          minimum: 1
          maximum: 17
        interests:
          type: array
          items:
            $ref: "#/components/schemas/InterestTag"
        deviceName:
          type: string
          minLength: 1
        screenTimeWeekday:
          $ref: "#/components/schemas/ScreenTimeMinutes"
        screenTimeWeekend:
          $ref: "#/components/schemas/ScreenTimeMinutes"
        appleArcade:
          type: boolean
        archived:
          type: boolean
          description: Soft delete. Archived profiles keep their record and statuses but leave the dashboard and the default list.

    CatalogApp:
      type: object
      required: [id, name, appStoreUrl, category, ageMin, ageMax, interestTags, costModel, adStatus, notes, lastVerified, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          multipleOf: 1
        name:
          type: string
          minLength: 1
        appStoreUrl:
          type: string
          format: uri
        category:
          $ref: "#/components/schemas/Category"
        ageMin:
          type: integer
          multipleOf: 1
          minimum: 0
          maximum: 17
        ageMax:
          type: integer
          multipleOf: 1
          minimum: 0
          maximum: 17
        interestTags:
          type: array
          items:
            $ref: "#/components/schemas/InterestTag"
        costModel:
          $ref: "#/components/schemas/CostModel"
        adStatus:
          $ref: "#/components/schemas/AdStatus"
        notes:
          type: string
        lastVerified:
          type: string
        status:
          $ref: "#/components/schemas/CatalogStatus"
        createdAt:
          type: string
        updatedAt:
          type: string

    AppInput:
      type: object
      required: [name, appStoreUrl, category, ageMin, ageMax, interestTags, costModel, adStatus, notes, status]
      properties:
        name:
          type: string
          minLength: 1
        appStoreUrl:
          type: string
          format: uri
        category:
          $ref: "#/components/schemas/Category"
        ageMin:
          type: integer
          multipleOf: 1
          minimum: 0
          maximum: 17
        ageMax:
          type: integer
          multipleOf: 1
          minimum: 0
          maximum: 17
        interestTags:
          type: array
          items:
            $ref: "#/components/schemas/InterestTag"
        costModel:
          $ref: "#/components/schemas/CostModel"
        adStatus:
          $ref: "#/components/schemas/AdStatus"
        notes:
          type: string
        status:
          $ref: "#/components/schemas/CatalogStatus"

    ChildAppStatusRecord:
      type: object
      required: [id, childId, appId, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          multipleOf: 1
        childId:
          type: integer
          multipleOf: 1
        appId:
          type: integer
          multipleOf: 1
        status:
          $ref: "#/components/schemas/InstallStatus"
        createdAt:
          type: string
        updatedAt:
          type: string

    ChildAppStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/InstallStatus"

    ExportData:
      type: object
      required: [children, apps, childAppStatuses]
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        apps:
          type: array
          items:
            $ref: "#/components/schemas/CatalogApp"
        childAppStatuses:
          type: array
          items:
            $ref: "#/components/schemas/ChildAppStatusRecord"

    DashboardAppEntry:
      type: object
      required: [app, childStatus]
      properties:
        app:
          $ref: "#/components/schemas/CatalogApp"
        childStatus:
          $ref: "#/components/schemas/InstallStatus"

    DashboardEntry:
      type: object
      required: [child, matchedApps]
      properties:
        child:
          $ref: "#/components/schemas/Child"
        matchedApps:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAppEntry"
